    <meta property="og:title" content="대한예수교장로회 하남 시온성교회" />

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <!-- 모바일 전용 여백 및 글자 줄바꿈 최적화 (Tailwind 우선순위 덮어쓰기) -->
    <style>
      @media (max-width: 640px) {
        /* 1. 단어 단위 예쁜 줄바꿈 강제 적용 */
        * {
          word-break: keep-all !important;
          overflow-wrap: break-word !important;
        }

        /* 2. 상단 성경 구절 및 본문 텍스트 양옆 여백 확보 */
        .hero-verse,
        main p,
        section p {
          padding-left: 0.5rem !important;
          padding-right: 0.5rem !important;
        }

        /* 3. 예배 시간표 모바일 크기 축소 */
        table {
          font-size: 0.8rem !important;
        }
        table th, table td {
          padding: 8px 4px !important;
          white-space: normal !important;
        }

        /* 4. 주보 모달 및 카드 팝업 가로폭 튀어나옴 차단 */
        div[role="dialog"],
        .fixed > div {
          max-width: 90vw !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }

        /* 5. 우측 하단 플로팅 버튼이 본문을 가리지 않도록 하단 여백 추가 */
        footer {
          padding-bottom: 6rem !important;
        }
      }
    </style>
  </head>
  <body class="font-sans antialiased text-slate-800 bg-[#F8F9FA] selection:bg-[#1E3A5F] selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
