    <!-- 모바일 전용 여백 및 글자 줄바꿈 최적화 -->
    <style>
      @media (max-width: 640px) {
        /* 단어 중간 어색한 줄바꿈 방지 */
        body, p, span, h1, h2, h3, h4, td, th {
          word-break: keep-all;
          overflow-wrap: break-word;
        }

        /* 1. 상단 말씀 및 메인 타이틀 정돈 */
        .hero-verse, [class*="max-w"] p {
          padding-left: 1rem;
          padding-right: 1rem;
        }

        /* 2. 예배 시간표 모바일 최적화 */
        table {
          font-size: 0.85rem;
        }
        th, td {
          padding: 8px 6px !important;
        }

        /* 3. 섹션 타이틀 줄바꿈 방지 */
        h2, h3 {
          letter-spacing: -0.5px;
        }

        /* 4. 주보 모달 박스 튀어나옴 방지 */
        .modal-content, [role="dialog"], [class*="fixed"] > div {
          max-width: 92vw !important;
          box-sizing: border-box !important;
        }

        /* 5. 우측 하단 플로팅 버튼 위치 정리 (하단 겹침 완화) */
        .fixed.bottom-6.right-6,
        [class*="bottom-4"][class*="right-4"] {
          bottom: 4.5rem !important;
        }

        /* 푸터 줄간격 및 여백 */
        footer {
          padding-bottom: 5rem !important;
          line-height: 1.6;
        }
      }
    </style>
  </head>
  <body class="font-sans antialiased text-slate-800 bg-[#F8F9FA] selection:bg-[#1E3A5F] selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
