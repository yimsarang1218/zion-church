<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Warm Gradient -->
    <linearGradient id="bgGrad" x1="960" y1="0" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="40%" stop-color="#FBF7F0" />
      <stop offset="80%" stop-color="#F6EFE5" />
      <stop offset="100%" stop-color="#EFE6DA" />
    </linearGradient>

    <!-- Radial Soft Warm Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F5ECE0" stop-opacity="0" />
    </radialGradient>

    <!-- Floral Gradients -->
    <radialGradient id="roseCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#F43F5E" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#FDA4AF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFE4E6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="carnationSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#FB7185" stop-opacity="0.7" />
      <stop offset="85%" stop-color="#FECDD3" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFF1F2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldFloral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="leafGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D7C0F" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="leafGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803D" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C49A45" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#C49A45" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#C49A45" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C49A45" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#centerGlow)" />

  <!-- 2. Elegant Border Lines -->
  <rect x="40" y="40" width="1840" height="1000" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="2" />
  <rect x="52" y="52" width="1816" height="976" rx="8" fill="none" stroke="#D4AF37" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="8 6" />

  <!-- 3. Left Floral Watercolor Bouquet -->
  <g id="left-bouquet" opacity="0.92">
    <!-- Leaves -->
    <path d="M120 220 Q60 170 140 120 Q170 190 120 220 Z" fill="url(#leafGrad1)" />
    <path d="M160 310 Q80 300 110 390 Q170 370 160 310 Z" fill="url(#leafGrad2)" />
    <path d="M220 180 Q190 90 290 130 Q270 210 220 180 Z" fill="url(#leafGrad1)" />
    <path d="M180 430 Q120 480 200 520 Q240 450 180 430 Z" fill="url(#leafGrad2)" />
    <path d="M110 520 Q40 560 90 630 Q150 590 110 520 Z" fill="url(#leafGrad1)" />

    <!-- Flower Blooms -->
    <!-- Large Central Rose -->
    <circle cx="210" cy="260" r="110" fill="url(#roseCore)" />
    <circle cx="215" cy="255" r="75" fill="url(#carnationSoft)" opacity="0.85" />
    <circle cx="220" cy="250" r="45" fill="url(#roseCore)" opacity="0.9" />

    <!-- Upper Carnation -->
    <circle cx="150" cy="150" r="85" fill="url(#carnationSoft)" />
    <circle cx="155" cy="145" r="55" fill="url(#roseCore)" opacity="0.75" />

    <!-- Lower Rose -->
    <circle cx="170" cy="400" r="95" fill="url(#roseCore)" />
    <circle cx="175" cy="395" r="60" fill="url(#carnationSoft)" opacity="0.8" />

    <!-- Small Accent Blooms -->
    <circle cx="280" cy="350" r="65" fill="url(#goldFloral)" />
    <circle cx="290" cy="210" r="55" fill="url(#carnationSoft)" />
    <circle cx="130" cy="510" r="60" fill="url(#roseCore)" opacity="0.65" />
    <circle cx="240" cy="480" r="45" fill="url(#goldFloral)" opacity="0.6" />

    <!-- Delicate Petal Scatter -->
    <ellipse cx="360" cy="270" rx="14" ry="9" fill="#FB7185" opacity="0.6" transform="rotate(25 360 270)" />
    <ellipse cx="330" cy="390" rx="12" ry="8" fill="#F43F5E" opacity="0.5" transform="rotate(-35 330 390)" />
    <ellipse cx="260" cy="550" rx="15" ry="10" fill="#E11D48" opacity="0.45" transform="rotate(45 260 550)" />
  </g>

  <!-- 4. Right Floral Watercolor Bouquet -->
  <g id="right-bouquet" opacity="0.92">
    <!-- Leaves -->
    <path d="M1800 220 Q1860 170 1780 120 Q1750 190 1800 220 Z" fill="url(#leafGrad1)" />
    <path d="M1760 310 Q1840 300 1810 390 Q1750 370 1760 310 Z" fill="url(#leafGrad2)" />
    <path d="M1700 180 Q1730 90 1630 130 Q1650 210 1700 180 Z" fill="url(#leafGrad1)" />
    <path d="M1740 430 Q1800 480 1720 520 Q1680 450 1740 430 Z" fill="url(#leafGrad2)" />
    <path d="M1810 520 Q1880 560 1830 630 Q1770 590 1810 520 Z" fill="url(#leafGrad1)" />

    <!-- Flower Blooms -->
    <!-- Large Central Rose -->
    <circle cx="1710" cy="260" r="110" fill="url(#roseCore)" />
    <circle cx="1705" cy="255" r="75" fill="url(#carnationSoft)" opacity="0.85" />
    <circle cx="1700" cy="250" r="45" fill="url(#roseCore)" opacity="0.9" />

    <!-- Upper Carnation -->
    <circle cx="1770" cy="150" r="85" fill="url(#carnationSoft)" />
    <circle cx="1765" cy="145" r="55" fill="url(#roseCore)" opacity="0.75" />

    <!-- Lower Rose -->
    <circle cx="1750" cy="400" r="95" fill="url(#roseCore)" />
    <circle cx="1745" cy="395" r="60" fill="url(#carnationSoft)" opacity="0.8" />

    <!-- Small Accent Blooms -->
    <circle cx="1640" cy="350" r="65" fill="url(#goldFloral)" />
    <circle cx="1630" cy="210" r="55" fill="url(#carnationSoft)" />
    <circle cx="1790" cy="510" r="60" fill="url(#roseCore)" opacity="0.65" />
    <circle cx="1680" cy="480" r="45" fill="url(#goldFloral)" opacity="0.6" />

    <!-- Delicate Petal Scatter -->
    <ellipse cx="1560" cy="270" rx="14" ry="9" fill="#FB7185" opacity="0.6" transform="rotate(-25 1560 270)" />
    <ellipse cx="1590" cy="390" rx="12" ry="8" fill="#F43F5E" opacity="0.5" transform="rotate(35 1590 390)" />
    <ellipse cx="1660" cy="550" rx="15" ry="10" fill="#E11D48" opacity="0.45" transform="rotate(-45 1660 550)" />
  </g>

  <!-- 5. Bottom Warm Glow with subtle floral hints -->
  <g opacity="0.6">
    <circle cx="480" cy="980" r="90" fill="url(#carnationSoft)" />
    <circle cx="1440" cy="980" r="90" fill="url(#carnationSoft)" />
    <path d="M430 940 Q400 900 460 880 Q480 920 430 940 Z" fill="url(#leafGrad1)" />
    <path d="M1490 940 Q1520 900 1460 880 Q1440 920 1490 940 Z" fill="url(#leafGrad1)" />
  </g>
</svg>
